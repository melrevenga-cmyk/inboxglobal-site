<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>InboxGlobal.io × AIS — Pilot Debrief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ink: #141412; --ink-2: #4a4a46; --ink-3: #8a8a84;
  --navy: #12284B; --paper: #FAFAF7; --surface: #FFFFFF;
  --rule: rgba(0,0,0,0.1); --rule-med: rgba(0,0,0,0.18);
  --accent: #1D4E3A; --accent-light: #E6F2ED; --accent-mid: #2E7D5A;
  --amber: #92600A; --amber-light: #FEF3DC;
  --coral: #8C3820; --coral-light: #FAEDE8;
  --purple: #4A3B8C; --purple-light: #EEEDFB;
}
html { font-size: 15px; }
body { font-family: 'DM Sans', sans-serif; background: var(--paper); color: var(--ink); line-height: 1.65; }
strong { font-weight: 500; color: var(--ink); }

/* ── GATE ── */
#pw-gate { min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--navy); color:var(--paper); position:relative; overflow:hidden; }
#pw-gate::before { content:''; position:absolute; top:-200px; right:-200px; width:600px; height:600px; border-radius:50%; background:radial-gradient(circle, rgba(46,125,90,0.25) 0%, transparent 70%); pointer-events:none; }
.gate-box { text-align:center; max-width:400px; width:100%; padding:2rem; position:relative; }
.gate-brand { font-family:'Instrument Serif',serif; font-size:32px; margin-bottom:0.5rem; }
.gate-sub { font-size:13px; color:rgba(255,255,255,0.5); margin-bottom:2rem; }
#pw-input { width:100%; padding:12px 16px; border:0.5px solid rgba(255,255,255,0.2); border-radius:8px; background:rgba(255,255,255,0.06); color:white; font-family:inherit; font-size:15px; margin-bottom:1rem; outline:none; }
#pw-input:focus { border-color: var(--accent-mid); }
#pw-btn { width:100%; padding:12px 16px; border:none; border-radius:8px; background:var(--accent-mid); color:white; font-family:inherit; font-size:14px; font-weight:500; cursor:pointer; }
#pw-btn:disabled { opacity:0.6; cursor:wait; }
#pw-error { color:#F0A080; font-size:12px; margin-top:0.75rem; display:none; }

/* ── COVER ── */
.cover { min-height:100vh; display:flex; flex-direction:column; justify-content:space-between; padding:4rem; background:var(--navy); color:var(--paper); position:relative; overflow:hidden; }
.cover::before { content:''; position:absolute; top:-200px; right:-200px; width:600px; height:600px; border-radius:50%; background:radial-gradient(circle, rgba(46,125,90,0.25) 0%, transparent 70%); pointer-events:none; }
.cover-top { display:flex; justify-content:space-between; align-items:flex-start; }
.logo-mark { font-size:13px; font-weight:500; letter-spacing:0.05em; color:rgba(255,255,255,0.5); text-transform:uppercase; }
.conf-pill { font-size:10px; font-weight:500; letter-spacing:0.1em; text-transform:uppercase; background:rgba(255,255,255,0.1); border:0.5px solid rgba(255,255,255,0.2); color:rgba(255,255,255,0.6); padding:4px 14px; border-radius:99px; }
.cover-date { font-size:12px; color:rgba(255,255,255,0.35); letter-spacing:0.05em; text-transform:uppercase; }
.cover-main { flex:1; display:flex; flex-direction:column; justify-content:center; padding:6rem 0 4rem; }
.cover-eyebrow { font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--accent-mid); margin-bottom:1.5rem; }
.cover-title { font-family:'Instrument Serif',serif; font-weight:400; font-size:clamp(40px,6vw,68px); line-height:1.08; color:#fff; max-width:820px; margin-bottom:2rem; }
.cover-title em { font-style:italic; color:rgba(255,255,255,0.45); }
.cover-sub { font-size:15px; color:rgba(255,255,255,0.5); max-width:520px; line-height:1.6; }
.cover-bottom { display:flex; justify-content:space-between; align-items:flex-end; gap:1rem; padding-top:2rem; border-top:0.5px solid rgba(255,255,255,0.12); }
.cover-for { font-size:12px; color:rgba(255,255,255,0.35); letter-spacing:0.05em; text-transform:uppercase; margin-bottom:4px; }
.cover-client { font-size:16px; font-weight:500; color:rgba(255,255,255,0.8); }
.cover-pilot-badge { background:var(--accent-mid); color:white; font-size:11px; font-weight:500; padding:6px 16px; border-radius:99px; letter-spacing:0.05em; text-transform:uppercase; white-space:nowrap; }
.cover-pilot-badge .strike { opacity:0.6; text-decoration:line-through; text-decoration-thickness:1px; }

/* ── BODY ── */
.doc { max-width:900px; margin:0 auto; padding:5rem 4rem; }
.conf-bar { display:flex; align-items:center; gap:10px; margin-bottom:3rem; padding:10px 16px; border:0.5px solid rgba(0,0,0,0.15); border-radius:6px; background:var(--paper); flex-wrap:wrap; }
.conf-dot { width:6px; height:6px; border-radius:50%; background:var(--navy); flex-shrink:0; }
.conf-label { font-size:10px; font-weight:500; letter-spacing:0.12em; text-transform:uppercase; }
.conf-text { font-size:10px; color:var(--ink-3); letter-spacing:0.04em; }
.section-eyebrow { font-size:10px; font-weight:500; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-3); margin-bottom:0.5rem; }
.section-title { font-family:'Instrument Serif',serif; font-weight:400; font-size:32px; line-height:1.15; margin-bottom:1.25rem; }
.section-title em { font-style:italic; color:var(--ink-3); }
.lead { font-size:16px; color:var(--ink-2); line-height:1.7; max-width:680px; margin-bottom:2.5rem; }
p { color:var(--ink-2); margin-bottom:1rem; font-size:14px; }
.footnote { font-size:12px; color:var(--ink-3); font-style:italic; margin-top:1rem; }
hr { border:none; border-top:0.5px solid var(--rule); margin:3.5rem 0; }

.card { background:var(--surface); border:0.5px solid var(--rule-med); border-radius:12px; padding:1.5rem; }
.card-green { border-left:3px solid var(--accent-mid); border-radius:0 12px 12px 0; }
.card-amber { border-left:3px solid var(--amber); border-radius:0 12px 12px 0; }
.card-title { font-size:14px; font-weight:500; margin-bottom:6px; }
.card-body { font-size:13px; color:var(--ink-2); line-height:1.55; }
.grid-2 { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }

.metric-row { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:2rem; }
.metric-3 { grid-template-columns:repeat(3,1fr); }
.metric-card { background:var(--surface); border:0.5px solid var(--rule); border-radius:10px; padding:1.25rem; }
.metric-hero { background:var(--navy); border-color:var(--navy); }
.metric-hero .metric-num { color:#fff; }
.metric-hero .metric-desc { color:rgba(255,255,255,0.55); }
.metric-num { font-family:'Instrument Serif',serif; font-size:36px; line-height:1; margin-bottom:6px; }
.metric-desc { font-size:11px; color:var(--ink-3); line-height:1.4; }

/* scorecard */
.scorecard { background:var(--surface); border:0.5px solid var(--rule); border-radius:12px; overflow:hidden; }
.sc-head, .sc-row { display:grid; grid-template-columns:1.1fr 1.2fr 1.8fr 110px; gap:1rem; padding:12px 1.25rem; align-items:center; }
.sc-head { font-size:10px; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-3); border-bottom:0.5px solid var(--rule-med); }
.sc-row { border-bottom:0.5px solid var(--rule); font-size:13px; }
.sc-row:last-child { border-bottom:none; }
.sc-measure { font-weight:500; }
.sc-target { color:var(--ink-3); }
.sc-result { color:var(--ink-2); }

.status { display:inline-flex; align-items:center; gap:6px; font-size:10px; font-weight:500; letter-spacing:0.06em; text-transform:uppercase; padding:4px 10px; border-radius:99px; white-space:nowrap; }
.status::before { content:''; width:6px; height:6px; border-radius:50%; background:currentColor; }
.status-beat, .status-live { background:var(--accent-light); color:var(--accent); }
.status-open, .status-final { background:var(--amber-light); color:var(--amber); }
.status-inbound { background:var(--purple-light); color:var(--purple); }

.callout { background:var(--accent-light); border-left:3px solid var(--accent-mid); border-radius:0 8px 8px 0; padding:1rem 1.25rem; margin:1.75rem 0 0; font-size:13px; color:var(--accent); font-style:italic; }

/* deals */
.stage-legend { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; font-size:10px; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-3); margin-bottom:10px; padding:0 1.5rem; }
.deal { background:var(--surface); border:0.5px solid var(--rule-med); border-radius:12px; padding:1.25rem 1.5rem; margin-bottom:14px; }
.deal-top { display:flex; justify-content:space-between; align-items:flex-start; gap:1rem; margin-bottom:14px; }
.deal-name { font-size:16px; font-weight:500; }
.deal-meta { font-size:12px; color:var(--ink-3); }
.track { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; margin-bottom:14px; }
.track i { display:block; height:6px; border-radius:3px; background:#ECEBE5; }
.track i.on { background:var(--accent-mid); }
.track i.on.amber { background:var(--amber); }
.deal-body { font-size:13px; color:var(--ink-2); line-height:1.55; }
.deal-src { margin-top:8px; }
.deal-sm { margin-bottom:0; }
.deal-sm .stage-legend { display:none; }
.tool-pill { display:inline-block; font-size:10px; font-weight:500; padding:2px 8px; border-radius:99px; margin:4px 3px 0 0; border:0.5px solid var(--rule-med); color:var(--ink-3); background:var(--paper); }

/* dot field */
.dotfield-wrap { background:var(--surface); border:0.5px solid var(--rule); border-radius:12px; padding:1.5rem; margin-bottom:14px; }
.dotfield { display:grid; grid-template-columns:repeat(53, 1fr); gap:3px; }
.dotfield i { display:block; aspect-ratio:1; border-radius:2px; background:#ECEBE5; }
.dotfield i.on { background:var(--accent-mid); }
.dot-key { display:flex; gap:1.5rem; margin-top:12px; font-size:11px; color:var(--ink-3); flex-wrap:wrap; }
.dot-key span { display:flex; align-items:center; gap:6px; }
.dot-key i { width:9px; height:9px; border-radius:2px; display:inline-block; }
.k-on { background:var(--accent-mid); } .k-off { background:#ECEBE5; }

/* bars */
.bench, .geo { background:var(--surface); border:0.5px solid var(--rule); border-radius:12px; padding:1.25rem 1.5rem; }
.bench-title { font-size:11px; font-weight:500; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-3); margin-bottom:12px; }
.bench-row, .geo-row { display:grid; align-items:center; gap:12px; padding:6px 0; }
.bench-row { grid-template-columns:80px 1fr 44px; }
.bench-label, .geo-metro { font-size:13px; color:var(--ink-2); }
.bench-track, .geo-track { height:22px; position:relative; }
.bench-bar, .geo-bar { height:100%; background:var(--accent-mid); border-radius:0 4px 4px 0; position:relative; cursor:default; }
.bench-muted { background:#C9C8C0; }
.bench-val { font-family:'Instrument Serif',serif; font-size:22px; text-align:right; }
.bench-val.muted { color:var(--ink-3); }
.geo-row { grid-template-columns:170px 1fr 1.1fr; }
.geo-bar span { position:absolute; right:8px; top:50%; transform:translateY(-50%); font-size:11px; font-weight:500; color:#fff; }
.geo-bar.bench-muted span { color:var(--ink); }
.geo-bar.sm span { right:auto; left:100%; margin-left:8px; color:var(--ink-2); }
.geo-firms { font-size:12px; color:var(--ink-3); }
.geo-axis { font-size:11px; color:var(--ink-3); margin-top:10px; padding-top:10px; border-top:0.5px solid var(--rule); }
[data-tip]:hover::after { content:attr(data-tip); position:absolute; left:100%; top:50%; transform:translate(8px,-50%); background:var(--navy); color:#fff; font-size:11px; font-weight:400; padding:5px 9px; border-radius:6px; white-space:nowrap; z-index:5; pointer-events:none; }
[data-tip]:hover { filter:brightness(1.1); }

/* signals */
.signal-legend { display:flex; gap:1.5rem; margin-bottom:1rem; flex-wrap:wrap; }
.sig-item { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--ink-3); }
.sig-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.dot-hot { background:var(--coral); } .dot-warm { background:var(--amber); }
.sig-row { display:flex; align-items:flex-start; gap:12px; padding:14px 0; border-bottom:0.5px solid var(--rule); }
.sig-row:last-child { border-bottom:none; }
.sig-row-dot { width:8px; height:8px; border-radius:50%; margin-top:6px; flex-shrink:0; }
.sig-row-title { font-size:13px; font-weight:500; margin-bottom:3px; }
.sig-row-desc { font-size:12px; color:var(--ink-2); line-height:1.5; }
.next { font-size:10px; font-weight:500; letter-spacing:0.05em; text-transform:uppercase; color:var(--ink-3); border:0.5px solid var(--rule-med); padding:3px 9px; border-radius:99px; white-space:nowrap; margin-top:2px; }

/* pipeline */
.pipeline { background:var(--navy); border-radius:12px; padding:2rem; color:white; }
.pipeline-title { font-size:11px; font-weight:500; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.4); margin-bottom:1.5rem; }
.pipeline-row { display:flex; align-items:stretch; }
.pipe-node { background:rgba(255,255,255,0.06); border:0.5px solid rgba(255,255,255,0.12); border-radius:8px; padding:14px 16px; flex:1; }
.pipe-arrow { display:flex; align-items:center; padding:0 8px; color:rgba(255,255,255,0.25); font-size:14px; flex-shrink:0; }
.pipe-label { font-size:10px; color:var(--accent-mid); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:4px; }
.pipe-value { font-size:14px; color:rgba(255,255,255,0.9); font-weight:500; margin-bottom:4px; }
.pipe-sub { font-size:12px; color:rgba(255,255,255,0.5); line-height:1.5; }

.doc-footer { margin-top:5rem; padding-top:2rem; border-top:0.5px solid var(--rule); display:flex; justify-content:space-between; align-items:center; gap:1rem; }
.footer-brand { font-size:13px; font-weight:500; }
.footer-sub, .footer-conf { font-size:11px; color:var(--ink-3); }
.footer-conf { text-align:right; }


/* channel ranking */
.rank { background:var(--surface); border:0.5px solid var(--rule); border-radius:12px; overflow:hidden; }
.rank-head, .rank-row { display:grid; grid-template-columns:44px 1.9fr repeat(4, 74px) 120px; gap:12px; align-items:center; padding:14px 1.25rem; }
.rank-head { font-size:10px; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-3); border-bottom:0.5px solid var(--rule-med); padding-top:12px; padding-bottom:12px; }
.rank-head .c { text-align:center; }
.rank-row { border-bottom:0.5px solid var(--rule); }
.rank-row:last-child { border-bottom:none; }
.rank-row.first { background:linear-gradient(90deg, var(--accent-light), transparent 60%); }
.rank-pos { font-family:'Instrument Serif',serif; font-size:30px; line-height:1; color:var(--ink); }
.rank-row.pending .rank-pos { color:var(--ink-3); }
.ch-name { font-size:14px; font-weight:500; }
.ch-got { font-size:12px; color:var(--ink-2); line-height:1.45; margin-top:2px; }
.ch-tag { display:inline-block; margin-top:6px; font-size:10px; font-weight:500; letter-spacing:0.05em; text-transform:uppercase; color:var(--accent); background:var(--accent-light); padding:2px 8px; border-radius:99px; }
.pips { display:flex; gap:3px; justify-content:center; }
.pips i { width:9px; height:9px; border-radius:50%; background:#E4E3DC; display:block; }
.pips i.on { background:var(--accent-mid); }
.rank-total { display:flex; align-items:center; gap:8px; }
.rank-bar { flex:1; height:8px; background:#ECEBE5; border-radius:4px; overflow:hidden; }
.rank-bar b { display:block; height:100%; background:var(--navy); border-radius:0 4px 4px 0; }
.rank-score { font-family:'Instrument Serif',serif; font-size:20px; min-width:40px; text-align:right; }
.rank-score small { font-family:'DM Sans',sans-serif; font-size:10px; color:var(--ink-3); }
.rank-row.pending .ch-name, .rank-row.pending .ch-got { color:var(--ink-3); }
.pending-cell { grid-column:3 / span 5; font-size:11px; color:var(--ink-3); font-style:italic; text-align:center; border:1px dashed var(--rule-med); border-radius:6px; padding:6px; }
.rank-key { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:14px; }
.rank-key div { font-size:11px; color:var(--ink-3); line-height:1.45; }
.rank-key b { display:block; font-weight:500; color:var(--ink-2); font-size:11px; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:2px; }

/* september */
.months { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:14px; }
.month { background:var(--surface); border:0.5px solid var(--rule); border-radius:10px; padding:12px 14px; min-height:96px; }
.month-name { font-size:10px; font-weight:500; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-3); margin-bottom:6px; }
.month-note { font-size:12px; color:var(--ink-2); line-height:1.45; }
.month.hot { background:var(--navy); border-color:var(--navy); }
.month.hot .month-name { color:var(--accent-mid); }
.month.hot .month-note { color:rgba(255,255,255,0.8); }
.funnel { background:var(--surface); border:0.5px solid var(--rule); border-radius:12px; padding:1.25rem 1.5rem; }
.funnel-row { display:grid; grid-template-columns:150px 1fr 90px; gap:12px; align-items:center; padding:7px 0; }
.funnel-label { font-size:13px; color:var(--ink-2); }
.funnel-track { height:30px; position:relative; }
.funnel-bar { height:100%; border-radius:0 4px 4px 0; background:#C9C8C0; position:relative; }
.funnel-bar.go { background:var(--accent-mid); }
.funnel-val { font-family:'Instrument Serif',serif; font-size:24px; text-align:right; }
.funnel-conv { font-size:12px; color:var(--accent); margin:6px 0 0 162px; }

/* key-value rows */
.kv { display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-top:0.5px solid var(--rule); font-size:13px; color:var(--ink-2); }
.kv b { font-weight:500; color:var(--ink); white-space:nowrap; }
.kv-row { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
@media (max-width:760px){ .kv-row { grid-template-columns:1fr 1fr; } }

/* placeholder */
.ph-row { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:14px; }
.ph { border:1px dashed var(--rule-med); border-radius:10px; padding:1.1rem 1.25rem; background:repeating-linear-gradient(135deg, transparent 0 8px, rgba(0,0,0,0.018) 8px 16px); }
.ph-num { font-family:'Instrument Serif',serif; font-size:30px; color:var(--ink-3); line-height:1; margin-bottom:6px; }
.ph-desc { font-size:11px; color:var(--ink-3); }
.ph-flag { display:inline-flex; align-items:center; gap:6px; font-size:10px; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; color:var(--amber); background:var(--amber-light); padding:3px 10px; border-radius:99px; margin-bottom:1rem; }

@media (max-width: 760px) {
  .rank-head { display:none; }
  .rank-row { grid-template-columns:36px 1fr; row-gap:10px; padding:16px 1rem; }
  .rank-row > .pips, .rank-row > .rank-total, .pending-cell { grid-column:2; }
  .rank-row > .pips { justify-content:flex-start; }
  .rank-row > .pips::before { content:attr(data-l); font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-3); width:84px; }
  .rank-key { grid-template-columns:1fr 1fr; }
  .months { grid-template-columns:1fr 1fr; }
  .funnel-row { grid-template-columns:1fr 70px; }
  .funnel-label { grid-column:1 / span 2; }
  .funnel-conv { margin-left:0; }
  .ph-row { grid-template-columns:1fr 1fr; }
}

@media print {
  #pw-gate { display:none !important; }
  .cover { min-height:auto; page-break-after:always; }
  hr { page-break-after:always; border:none; margin:0; }
  [data-tip]:hover::after { display:none; }
}
@media (max-width: 760px) {
  .cover { padding:2rem 16px; }
  .cover-bottom { flex-direction:column; align-items:flex-start; }
  .doc { padding:3rem 16px; }
  .metric-row, .metric-3 { grid-template-columns:repeat(2,1fr); }
  .grid-2 { grid-template-columns:1fr; }
  .sc-head { display:none; }
  .sc-row { grid-template-columns:1fr; gap:4px; padding:14px 1rem; }
  .sc-target::before { content:'Target: '; }
  .stage-legend { padding:0 1rem; font-size:9px; }
  .deal { padding:1.25rem 1rem; }
  .deal-top { flex-direction:column; gap:8px; }
  .dotfield { grid-template-columns:repeat(30, 1fr); gap:2px; }
  .geo-row { grid-template-columns:1fr; gap:4px; }
  .pipeline { padding:1.5rem 1rem; }
  .pipeline-row { flex-direction:column; }
  .pipe-arrow { justify-content:center; padding:6px 0; transform:rotate(90deg); }

function b64(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); }

async function unlock(code){
  var enc = new TextEncoder();
  var base = await crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveKey']);
  var key = await crypto.subtle.deriveKey(
    { name:'PBKDF2', salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  var plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(PAYLOAD.iv) }, key, b64(PAYLOAD.data));
  return new TextDecoder().decode(plain);
}

function buildDots(){
  var el = document.getElementById('dotfield');
  if(!el) return;
  var total = 636, accepted = 70, html = '';
  // seeded shuffle so the same 70 squares light up on every visit
  var idx = [], seed = 42, lit = {};
  for(var n = 0; n < total; n++) idx.push(n);
  for(var k = total - 1; k > 0; k--){
    seed = (seed * 16807) % 2147483647;
    var r = seed % (k + 1), t = idx[k]; idx[k] = idx[r]; idx[r] = t;
  }
  for(var a = 0; a < accepted; a++) lit[idx[a]] = 1;
  for(var i = 0; i < total; i++) html += lit[i] ? '<i class="on"></i>' : '<i></i>';
  el.innerHTML = html;
}

function buildPips(){
  document.querySelectorAll('.pips[data-s]').forEach(function(el){
    var n = +el.getAttribute('data-s'), h = '';
    for(var i = 1; i <= 5; i++) h += '<i' + (i <= n ? ' class="on"' : '') + '></i>';
    el.innerHTML = h;
    el.setAttribute('aria-label', n + ' out of 5');
  });
}

function show(html){
  var c = document.getElementById('content');
  c.innerHTML = html;
  c.hidden = false;
  document.getElementById('pw-gate').style.display = 'none';
  buildDots();
  buildPips();
  window.scrollTo(0, 0);
}

document.getElementById('pw-form').addEventListener('submit', async function(e){
  e.preventDefault();
  var input = document.getElementById('pw-input'), btn = document.getElementById('pw-btn'), err = document.getElementById('pw-error');
  btn.disabled = true; err.style.display = 'none';
  try {
    var code = input.value.trim();
    var html = await unlock(code);
    try { sessionStorage.setItem('ais-debrief', code); } catch(_){}
    show(html);
  } catch(_){
    err.style.display = 'block'; input.value = ''; input.focus();
  }
  btn.disabled = false;
});

// Stay unlocked on refresh within the same tab session
(function(){
  try {
    var saved = sessionStorage.getItem('ais-debrief');
    if(saved) unlock(saved).then(show).catch(function(){ sessionStorage.removeItem('ais-debrief'); });
  } catch(_){}
})();
</script>
